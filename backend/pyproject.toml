[project]
name = "backend"
version = "0.1.0"
description = "TechBase ingestion service — parses DOCX/PDF uploads into structured knowledge articles."
readme = "README.md"
authors = [
    { name = "Joseph Clark", email = "weirdlookingjay@live.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

# ─── Ruff ─────────────────────────────────────────────────────────────────────
# One tool for lint + format. Config kept short on purpose; add rules as pain
# surfaces, don't pre-emptively bikeshed.

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "dist", "build"]

[tool.ruff.lint]
# Pragmatic baseline:
#   E, F, W  → pycodestyle + pyflakes core
#   I        → import sorting (replaces isort)
#   N        → PEP 8 naming
#   UP       → pyupgrade (modernize syntax)
#   B        → flake8-bugbear (likely bugs)
#   C4       → flake8-comprehensions
#   SIM      → flake8-simplify
#   PT       → flake8-pytest-style
#   RUF      → ruff-native rules
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PT", "RUF"]
# Line length is enforced by the formatter, not the linter.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]            # asserts are the point in tests
"**/__init__.py" = ["F401"]     # re-exports via __init__

[tool.ruff.lint.isort]
known-first-party = ["backend"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ─── Pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error",
    # pydantic v2 emits a few deprecation warnings in fastapi 0.1x; keep an eye
    # on these and remove the ignore once upstream is clean.
    "ignore::DeprecationWarning:pydantic.*",
]
