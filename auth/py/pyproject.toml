[project]
name = "auth-py"
version = "0.1.0"
description = "Verify short-lived HMAC assertions for a FastAPI host. No database and no host models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auth_py"
module-root = "src"
